name: Deploy to Github Pages

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

permissions:
    contents: read
    pages: write
    id-token: write

# Only one deployment at a time; skip queued runs, let the newest one finish.
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Cache Hugo resources
              uses: actions/cache@v4
              env:
                  cache-name: cache-hugo-resources
              with:
                  path: resources
                  key: ${{ env.cache-name }}

            - uses: actions/setup-go@v5
              with:
                  go-version: "^1.17.0"
            - run: go version

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v2
              with:
                  hugo-version: "latest"
                  extended: true

            - name: Build
              run: hugo --minify --gc

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./public

    # Publica no GitHub Pages via upload de artefato (não git push) — sem limite de
    # 100 MB por arquivo, só um teto de ~1 GB para o site inteiro. Só roda em push
    # direto na master, não em pull request.
    deploy:
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages 🚀
              id: deployment
              uses: actions/deploy-pages@v4
